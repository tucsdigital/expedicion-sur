name: Cron - Limpiar Holds

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  cleanup-holds:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar endpoint de limpieza de holds
        run: |
          test -n "${{ secrets.APP_URL }}" || (echo "Falta APP_URL" && exit 1)
          test -n "${{ secrets.CRON_SECRET }}" || (echo "Falta CRON_SECRET" && exit 1)
          curl --fail-with-body --silent --show-error --retry 2 -X POST "${{ secrets.APP_URL }}/api/cron/cleanup-reservation-holds" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
